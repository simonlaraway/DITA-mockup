name: Publish to GitHub Pages

# Production: every push to main builds both guides and deploys them to the root of the
# gh-pages branch. PR previews live under pr-preview/ on the same branch (see staging.yml)
# and are left alone here.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # DITA-OT is ~50 MB; cache it, keyed on build.sh (which pins the version).
      - uses: actions/cache@v6
        with:
          path: tools
          key: dita-ot-${{ hashFiles('build.sh') }}

      - name: Build all deliverables
        run: ./build.sh

      - name: Deploy to gh-pages (root)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean-exclude: pr-preview/
          commit-message: Publish ${{ github.sha }}
